<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Redirect | AeroDelay Ops</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css?v=5.5.0">
    <script>
        (function() {
            var path = window.location.pathname;
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            var base = '/flight-delay-prediction/';
            
            // Map common extensionless paths
            if (path.indexOf('about') !== -1) {
                window.location.replace(base + 'about.html' + search + hash);
            } else if (path.indexOf('predict') !== -1) {
                window.location.replace(base + 'predict.html' + search + hash);
            } else if (path.indexOf('performance') !== -1) {
                window.location.replace(base + 'performance.html' + search + hash);
            } else if (path.indexOf('dashboard') !== -1) {
                window.location.replace(base + 'dashboard.html' + search + hash);
            } else {
                setTimeout(function() {
                    window.location.replace(base + 'index.html');
                }, 2000);
            }
        })();
    </script>
</head>
<body class="bg-cream text-charcoal min-vh-100 d-flex flex-column justify-content-center align-items-center p-4">
    <div class="card p-5 text-center shadow-sm border border-stone-200" style="max-width: 540px; background: #fff;">
        <div class="display-1 text-amber-accent font-serif mb-3">✈️ 404</div>
        <h1 class="h4 font-serif text-stone-900 mb-2">Redirecting to AeroDelay Ops</h1>
        <p class="text-stone-600 fs-7 mb-4">You are being redirected to the correct destination within the commercial flight delay intelligence platform...</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="./index.html" class="btn btn-dark font-mono fs-8 px-4 py-2">Return Home</a>
            <a href="./about.html#section-reproducibility" class="btn btn-outline-secondary font-mono fs-8 px-4 py-2">8. Reproducibility Report</a>
        </div>
    </div>
</body>
</html>
